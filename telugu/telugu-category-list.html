<!-- SCRIPT -->
<script>
const container = document.getElementById("latest-stories");

// ✅ Only Telugu stories
const teluguStories = stories.filter(story => story.language === "telugu");

// ✅ Sort latest first
const sortedStories = teluguStories.sort((a, b) => new Date(b.date) - new Date(a.date));

// ✅ Top 5 latest
const latestStories = sortedStories.slice(0, 5);

const today = new Date();

latestStories.forEach(story => {
  const storyDate = new Date(story.date);
  const diffDays = (today - storyDate) / (1000 * 60 * 60 * 24);

  //  NEW badge (3 days)
  const isNew = diffDays <= 3 ? '<span class="new-badge">NEW</span>' : '';

  const li = document.createElement("li");

  li.innerHTML = `
    <a href="${story.link}">
       ${story.title} ${isNew}
    </a>
    <p>${story.desc}</p>
  `;

  container.appendChild(li);
});
</script>
